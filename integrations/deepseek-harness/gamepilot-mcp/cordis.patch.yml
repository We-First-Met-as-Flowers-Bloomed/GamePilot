- insert:
    - id: gamepilot-mcp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: gamepilot
        transport: stdio
        command: "D:/Node.js/node.exe"
        args:
          - "<project-root>/scripts/agent/mcp.mjs"
        cwd: "<project-root>"
        failOnStartupError: true
    - id: gamepilot-control-skills
      name: "@deepseek-ai/dsh-skill-filesystem"
      config:
        providerName: gamepilot-integration
        includeDefaultRoots: false
        customSkillDirs:
          - "<project-root>/integrations/deepseek-harness/gamepilot-mcp/skills"
